schema_version: 2

context:
  project_dir: /absolute/path/to/source
  work_dir: /absolute/path/to/writable-work
  workspace_dir: /absolute/path/to/opencode-workspace

serve:
  # Task Agent 的实现固定为 OpenCode；这里只保留 opencode。
  tool: opencode
  # 实际启动文件，可填写 opencode、nga 或完整路径。
  executable: opencode
  port: 4096
  timeout: 3600
  max_retries: 2
  # Serve 不继承 HTTP/HTTPS/ALL 代理变量；代理相关变量只允许绕过列表。
  # environment:
  #   NO_PROXY: 127.0.0.1,localhost
  #   no_proxy: 127.0.0.1,localhost
  environment: {}
  # standalone 会先合并用户全局、可执行文件相邻、项目和 OPENCODE_CONFIG*
  # 指定的 OpenCode 配置；这里是优先级更高的 YAML 内覆盖层。
  # 如果 provider 已在用户全局配置中定义，这里可以保持为空对象。
  # MCP 服务名可以自行定义。
  # standalone 不会自动安装 Skill；如需使用，请在这里注册实际绝对路径。
  # Task Agent 会在最终 opencode.json 中覆盖文件、SKILL 与 bash 的基础受管权限。
  # run_opencode_task(file_write_allowlist=...) 及兼容的 writable_paths 额外动态路径通过 Session API 下发。
  # 下列远程和本地示例默认关闭。替换占位配置后，将 enabled 改为 true。
  # timeout 的单位是毫秒。
  opencode_config:
    # skills:
    #   paths:
    #     - /absolute/path/to/opencode-workspace/.opencode/skills
    mcp:
      remote-example:
        type: remote
        url: http://127.0.0.1:9123/mcp
        enabled: false
        timeout: 30000
        oauth: false
        headers:
          Authorization: "Bearer replace-me"

      local-example:
        type: local
        command:
          - python3
          - -m
          - your_mcp_server
        environment:
          PROJECT_DIR: /absolute/path/to/source
        enabled: false
        timeout: 30000

model_pool:
  global_concurrency: 1
  models:
    - id: deepseek/deepseek-v4-pro
      model: deepseek/deepseek-v4-pro
      capability: high
      weight: 1
      max_concurrency: 1
      enabled: true

    - capability: high
      enabled: true
      id: deepseek/deepseek-v4-flash
      max_concurrency: 1
      model: deepseek/deepseek-v4-flash
      weight: 1
