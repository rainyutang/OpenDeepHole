label: 对抗式复核
description: 通过正报论证、误报论证和最终裁决逐项复核已确认问题。
default: true
max_concurrency: 2
stages:
  - key: prove_bug
    label: 确认漏洞
  - key: prove_fp
    label: 证明误报
  - key: final_judge
    label: 最终裁定
documents:
  - label: 确认漏洞
    path: skills/prove-bug/SKILL.md
  - label: 证明误报
    path: skills/prove-fp/SKILL.md
  - label: 最终裁定
    path: skills/final-judge/SKILL.md
