# OpenDeepHole Agent bootstrap and managed configuration.
# server_url / agent_name / owner_token are local-only; the remaining v5
# sections are managed by the Web "Agent 配置" page after first connection.

server_url: "http://your-server:8000"
agent_name: ""
owner_token: ""
checkers: []

schema_version: 5
opencode_config: |
  {}
base:
  tool: "opencode"
  executable: "opencode"
  no_proxy: "10.0.0.0/8"
  # null = choose one free local port once for this Agent process.
  opencode_serve_port: null

model_pool:
  global_concurrency: 4
  # A scan cannot start until at least one enabled row has an explicit model.
  models:
  - capability: high
    enabled: false
    executable: ''
    id: deepseek/deepseek-v4-pro
    max_concurrency: 1
    max_retries: null
    model: deepseek/deepseek-v4-pro
    time_windows: []
    timeout: null
    tool: ''
    weight: 1.0
  - capability: high
    enabled: true
    executable: ''
    id: deepseek/deepseek-v4-flash
    max_concurrency: 1
    max_retries: null
    model: deepseek/deepseek-v4-flash
    time_windows: []
    timeout: null
    tool: ''
    weight: 1.0

threat_analysis:
  enabled: true
  model_policy:
    required_capability: "high"
    timeout_seconds: 3600
    max_retries: 2

product_info:
  enabled: false
  name: "product-info"
  transport: "local"
  timeout_seconds: 300
  local:
    executable: "product-info"
    args: []
    environment: {}
  remote:
    url: ""
    headers: {}

vulnerability_mining:
  required_capability: "high"
  timeout_seconds: 3600
  max_retries: 2

# Empty means each engine.yaml default is used. The Web UI can override each
# discovered engine's enabled and fp_review_enabled values.
mining_engines: {}

false_positive:
  required_capability: "high"
  timeout_seconds: 3600
  max_retries: 2

vulnerability_validation:
  environments: {}
