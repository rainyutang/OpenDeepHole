# OpenDeepHole Agent bootstrap and managed configuration.
# server_url / agent_name / owner_token are local-only; the remaining v4
# sections are managed by the Web "客户端配置" page after first connection.

server_url: "http://your-server:8000"
agent_name: ""
owner_token: ""
checkers: []

schema_version: 4
base:
  tool: "opencode"
  executable: "opencode"
  no_proxy: "10.0.0.0/8"
  # null = choose one free local port once for this Agent process.
  opencode_serve_port: null

model_pool:
  global_concurrency: 4
  # A scan cannot start until at least one enabled row has an explicit model.
  models: []

threat_analysis:
  enabled: true
  model_policy:
    required_capability: "high"
    timeout_seconds: 3600
    max_retries: 2

product_info:
  enabled: false
  name: "product-info"
  transport: "local"
  timeout_seconds: 300
  local:
    executable: "product-info"
    args: []
    environment: {}
  remote:
    url: ""
    headers: {}

vulnerability_mining:
  required_capability: "high"
  timeout_seconds: 3600
  max_retries: 2

false_positive:
  required_capability: "high"
  timeout_seconds: 3600
  max_retries: 2

vulnerability_validation:
  environments: {}
