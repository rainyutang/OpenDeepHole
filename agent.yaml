# DeepHole 2.0 Agent bootstrap and managed configuration.
# server_url / agent_name / owner_token are local-only; the remaining v7
# sections are managed by the Web "客户端配置" page after first connection.

server_url: "http://your-server:8000"
agent_name: ""
owner_token: ""
checkers: []

schema_version: 7
base:
  # OpenCode is the fixed implementation; executable may be opencode, nga, or a full path.
  tool: "opencode"
  executable: "opencode"
  # Comma-separated; appended independently to inherited NO_PROXY and no_proxy.
  no_proxy: "10.0.0.0/8"
  # null = choose one free local port once for this Agent process.
  opencode_serve_port: null

model_pool:
  global_concurrency: 4
  # A scan cannot start until at least one enabled row has an explicit model.
  models: []

threat_analysis:
  enabled: true
  model_policy:
    required_capability: "high"
    timeout_seconds: 3600
    max_retries: 2

vulnerability_mining:
  required_capability: "high"
  timeout_seconds: 3600
  max_retries: 2

false_positive:
  required_capability: "high"
  timeout_seconds: 3600
  max_retries: 2

vulnerability_validation:
  supported_vulnerability_types:
    - "*"
  concurrency: 1
  validation_max_retries: 0
  model_policy:
    required_capability: "high"
    timeout_seconds: 3600
    max_retries: 2

checker_selection:
  # Each mode persists exclusions so newly discovered checkers stay enabled.
  quick:
    disabled_checkers:
      - "sensitive_clear"
      - "skill_only_project_audit"
  standard:
    disabled_checkers:
      - "skill_only_project_audit"
  custom:
    disabled_checkers: []
